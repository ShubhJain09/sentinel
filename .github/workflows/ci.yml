name: Sentinel CI/CT Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Code Quality, Security & Automated Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_PATH: /tmp/sentinel-ci.db
      JWT_SECRET: ci_test_jwt_secret_sentinel_2026_super_secure_key
      OWNER_INITIAL_PASSWORD: SentinelOwner2026!Secure

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Checking
        run: npm run typecheck

      - name: ESLint Code Quality
        run: npm run lint

      - name: Initialize CI Database
        run: node scripts/init-db.js

      - name: Automated Security & Architecture Tests
        run: npm test

      - name: Production Build Check
        run: npm run build
